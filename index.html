<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Tartalombiztonsági szabály: a saját fájlok (a PDFium is helyi másolat), a Google-belépés (gsi) és az Apps Script szerver.
       'wasm-unsafe-eval': a saját WebAssembly (PDFium) lefordítását engedi, tetszőleges JavaScript futtatását nem. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; connect-src 'self' https://accounts.google.com/gsi/ https://script.google.com https://script.googleusercontent.com; frame-src https://accounts.google.com/gsi/; img-src 'self' data: blob:; font-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1f2226" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Terep">
  <title>Terep</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <script src="js/theme.js"></script>
  <!-- Közös üzleti logika (azonos az apps-script/Logic.gs-sel): window.TerepLogic -->
  <script src="js/logic.js"></script>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <!-- Sorrend: logó (mindig bal oldalt; asztalon az oldalsáv szélességében) → vissza gomb (rajz nézetben) → cím -->
      <a id="brand" class="brand" href="#/projektek"><img src="icon.svg" alt="" width="32" height="32"><span class="wordmark"><b>REALFLEX</b><small>TEREP</small></span></a>
      <a id="back" class="icon-btn back-btn" href="#/" aria-label="Vissza a rajzokhoz" title="Vissza a rajzokhoz" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <span id="ptitle" class="ptitle"><small id="pproj" class="ellipsis"></small><span id="ptext" class="ellipsis"></span></span>
      <div class="topbar-right">
        <label id="edit-toggle" class="switch" hidden><input type="checkbox" id="edit-mode"><span>Szerkesztés</span></label>
        <a id="sync" class="sync-pill" href="#/fiok" hidden></a>
      </div>
    </header>
    <nav id="nav" class="nav" aria-label="Menü"></nav>
    <main id="view" class="view"></main>
  </div>
  <div id="toasts"></div>
  <noscript>Az alkalmazás működéséhez JavaScript szükséges.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
